name: Enviar menú diari per Telegram

on:
  schedule:
    # Executar el dia abans a les 7:00 PM (hora Europa/Madrid)
    # Diumenge a Dijous a les 17:00 UTC = 19:00 CEST (estiu) / 18:00 CET (hivern)
    # El menú s'envia per al dia següent (dilluns a divendres)
    - cron: '0 17 * * 0-4'

  # Permet executar-ho manualment des de GitHub
  workflow_dispatch:
    inputs:
      date:
        description: 'Data del menú (YYYY-MM-DD, deixa buit per demà)'
        required: false
        type: string

jobs:
  # Fase 1: comprovar si hi ha menú per la data objectiu.
  # Aquest job MAI falla per absència de menú: és un estat esperat
  # (PDF del mes encara no processat, o dia festiu fora del JSON).
  # El resultat es reporta al resum del run (GITHUB_STEP_SUMMARY).
  check-menu:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
      json_file: ${{ steps.check.outputs.json_file }}
      target_date: ${{ steps.check.outputs.target_date }}

    steps:
      - name: 📥 Checkout del repositori
        uses: actions/checkout@v4

      - name: 🔍 Comprovar si hi ha menú per la data objectiu
        id: check
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          inp = os.environ.get("INPUT_DATE", "").strip()
          target = date.fromisoformat(inp) if inp else date.today() + timedelta(days=1)

          months = {1: 'gener', 2: 'febrer', 3: 'març', 4: 'abril',
                    5: 'maig', 6: 'juny', 7: 'juliol', 8: 'agost',
                    9: 'setembre', 10: 'octubre', 11: 'novembre', 12: 'desembre'}
          json_file = f"menu/data/{months[target.month]}_{target.year}.json"

          available = False
          if not Path(json_file).exists():
              reason = (f"El fitxer `{json_file}` no existeix. "
                        f"Encara no s'ha processat el PDF d'aquest mes.")
          else:
              data = json.load(open(json_file, encoding='utf-8'))
              dates = [d.get('date') for d in data.get('days', [])]
              if target.isoformat() in dates:
                  available = True
                  reason = ""
              elif not dates:
                  reason = f"El fitxer `{json_file}` existeix però no conté cap dia."
              else:
                  reason = (f"La data `{target}` no és al menú "
                            f"(rang disponible: {dates[0]} a {dates[-1]}). "
                            f"Pot ser un dia festiu o de vacances.")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"available={'true' if available else 'false'}\n")
              f.write(f"json_file={json_file}\n")
              f.write(f"target_date={target.isoformat()}\n")

          icon = "✅" if available else "ℹ️"
          status = "Menú disponible" if available else "Sense menú (no és un error)"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"## {icon} Check del menú — {target.isoformat()}\n\n")
              f.write(f"- **Estat:** {status}\n")
              f.write(f"- **Fitxer:** `{json_file}`\n")
              if reason:
                  f.write(f"- **Motiu:** {reason}\n")

          print(f"{icon} {status}")
          print(f"📅 Data objectiu: {target.isoformat()}")
          print(f"📁 Fitxer: {json_file}")
          if reason:
              print(f"ℹ️ {reason}")
          PY

  # Fase 2: enviar el menú a Telegram. Només s'executa si hi ha menú.
  # Els errors d'enviament (token invàlid, API de Telegram, etc.) SÍ que
  # fan fallar el pipeline: són errors reals que cal veure en vermell.
  publish-menu:
    needs: check-menu
    if: needs.check-menu.outputs.available == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositori
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instal·lar dependències
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Enviar menú per Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 src/telegram_bot.py \
            -f "${{ needs.check-menu.outputs.json_file }}" \
            -d "${{ needs.check-menu.outputs.target_date }}"

      - name: ✅ Menú enviat correctament
        if: success()
        run: echo "🎉 Menú enviat amb èxit!"
